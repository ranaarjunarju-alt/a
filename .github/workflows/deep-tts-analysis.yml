name: Deep TTS framework and network analysis
on:
  push:
    branches: [arena/01a090c6-a]
    paths:
      - .github/workflows/deep-tts-analysis.yml
      - scripts/ExtractDeepTts.java
      - scripts/scan_apk_frameworks.py
      - scripts/analyze_native_libraries.py
permissions:
  contents: write
jobs:
  decompile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify APK and get decompiler
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo '46bb98a05a6c3be31a4557e08668a249fa759b9d140eedadbed38c3b4738452f  app-release.apk' | sha256sum -c -
          gh release download v1.5.3 --repo skylot/jadx --pattern jadx-1.5.3.zip --dir "$RUNNER_TEMP"
          unzip -q "$RUNNER_TEMP/jadx-1.5.3.zip" -d "$RUNNER_TEMP/jadx"
      - name: Decompile selected classes without executing APK
        run: |
          javac -cp "$RUNNER_TEMP/jadx/lib/*" -d "$RUNNER_TEMP" scripts/ExtractDeepTts.java
          java -Xmx5g -cp "$RUNNER_TEMP:$RUNNER_TEMP/jadx/lib/*" ExtractDeepTts app-release.apk analysis-report/deep-source
          python3 scripts/scan_apk_frameworks.py app-release.apk analysis-report/deep-evidence
          pip install pyelftools==0.32
          python3 scripts/analyze_native_libraries.py app-release.apk analysis-report/native-evidence
      - name: Publish targeted evidence on session branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analysis-report/deep-source analysis-report/deep-evidence analysis-report/native-evidence
          git diff --cached --quiet || git commit -m 'Save deeper TTS framework and network static evidence'
          git pull --rebase origin arena/01a090c6-a
          git push origin HEAD:arena/01a090c6-a
