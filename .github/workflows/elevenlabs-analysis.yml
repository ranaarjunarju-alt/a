name: ElevenLabs targeted static analysis
on:
  push:
    branches: [arena/01a090c6-a]
    paths:
      - .github/workflows/elevenlabs-analysis.yml
      - scripts/ExtractElevenLabs.java
permissions:
  contents: write
jobs:
  decompile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify APK and get decompiler
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo '46bb98a05a6c3be31a4557e08668a249fa759b9d140eedadbed38c3b4738452f  app-release.apk' | sha256sum -c -
          gh release download v1.5.3 --repo skylot/jadx --pattern jadx-1.5.3.zip --dir "$RUNNER_TEMP"
          unzip -q "$RUNNER_TEMP/jadx-1.5.3.zip" -d "$RUNNER_TEMP/jadx"
      - name: Decompile selected classes without executing APK
        run: |
          javac -cp "$RUNNER_TEMP/jadx/lib/*" -d "$RUNNER_TEMP" scripts/ExtractElevenLabs.java
          java -Xmx5g -cp "$RUNNER_TEMP:$RUNNER_TEMP/jadx/lib/*" ExtractElevenLabs app-release.apk analysis-report/elevenlabs-source
      - name: Publish targeted evidence on session branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analysis-report/elevenlabs-source
          git diff --cached --quiet || git commit -m 'Save targeted ElevenLabs decompilation evidence'
          git push origin HEAD:arena/01a090c6-a
