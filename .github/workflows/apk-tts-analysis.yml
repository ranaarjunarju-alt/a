name: APK TTS static analysis
on:
  push:
    branches: [arena/01a090c6-a]
    paths:
      - .github/workflows/apk-tts-analysis.yml
      - scripts/analyze_apk_tts.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install static parser
        run: pip install androguard==4.1.3
      - name: Inspect APK without executing it
        run: python scripts/analyze_apk_tts.py app-release.apk analysis-report
      - name: Show bounded report in logs
        if: always()
        run: |
          if test -f analysis-report/report.md; then
            cat analysis-report/report.md
            cat analysis-report/report.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apk-tts-static-analysis
          path: analysis-report/
          retention-days: 7
      - name: Save text evidence to this session branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis-report/report.md analysis-report/inventory.json analysis-report/manifest-summary.json analysis-report/tts-call-references.json analysis-report/tts-class-candidates.json analysis-report/hostname-candidates.json
          git diff --cached --quiet || git commit -m "Save APK TTS static evidence"
          git push origin HEAD:arena/01a090c6-a
